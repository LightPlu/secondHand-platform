spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Redis will be configured dynamically by TestContainers
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms

jwt.secret=testSecretKeyForJwtTokenGenerationMustBeLongEnough123456
jwt.expiration=3600000

# Cloudflare R2 (test dummy values)
cloud.r2.endpoint=http://localhost:9000
cloud.r2.access-key=test-access-key
cloud.r2.secret-key=test-secret-key
cloud.r2.bucket=test-bucket
cloud.r2.public-url=http://localhost:9000/test-bucket

# Hibernate/SQL ?? ???
logging.level.org.hibernate=warn
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off
logging.level.org.springframework.orm.jpa=warn
